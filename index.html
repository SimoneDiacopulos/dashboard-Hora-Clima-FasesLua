<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima e Lua SP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #0f2027;
            --bg-color-2: #203a43;
            --bg-color-3: #2c5364;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 4rem;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
            width: 550px;
        }

        .greeting {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .location {
            font-size: 1rem;
            font-weight: 300;
            color: #d1d5db;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .time {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .date {
            font-size: 1.2rem;
            color: #e5e7eb;
            margin-bottom: 2rem;
            text-transform: capitalize;
        }

        .frames-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            margin-bottom: 1rem;
        }

        .celestial-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 160px;
            height: 160px;
        }

        .celestial-svg {
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.3));
            animation: float 6s ease-in-out infinite;
        }

        img.celestial-svg {
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.3)) contrast(140%) brightness(110%) saturate(110%);
            /* Ajuda a aumentar a nitidez da imagem no navegador */
            image-rendering: -webkit-optimize-contrast; 
            border-radius: 0;
            object-fit: contain;
        }

        .celestial-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            border-radius: 50%;
            animation: pulse 4s infinite alternate;
        }

        .weather-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 160px;
            height: 160px;
            /* Hidden by default if clear sky */
            display: none; 
            animation: fadeIn 0.5s ease-out;
        }

        .weather-icon {
            width: 110px;
            height: 110px;
            opacity: 0.5;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            animation: float 5s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            to { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .frame-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: #ffffff;
            background: transparent;
            border: none;
            padding: 0.5rem 0;
            white-space: nowrap;
            letter-spacing: normal;
        }

    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="container">
        <h1 class="greeting" id="greeting">Boa noite!</h1>
        <div class="location">São Paulo, SP - Brasil</div>
        <div class="time" id="time">--:--:-- AM</div>
        <div class="date" id="date">Carregando data...</div>
        
        <div class="frames-wrapper">
            <!-- Frame 1: Sol ou Lua -->
            <div class="frame-column">
                <div class="celestial-container" id="celestial-container">
                    <div class="celestial-glow" id="celestial-glow"></div>
                    <div id="celestial-body"></div>
                </div>
                <div class="status-badge" id="celestial-name">Carregando astros...</div>
            </div>

            <!-- Frame 2: Condições Climáticas -->
            <div class="frame-column" id="weather-column">
                <div class="weather-container" id="weather-container">
                    <div id="weather-body"></div>
                </div>
                <div class="status-badge" id="weather-name">Carregando clima...</div>
            </div>
        </div>
    </div>

    <script>
        // Configurações e Coordenadas de São Paulo
        const LAT = -23.5489;
        const LON = -46.6388;
        
        // Estado Global
        let weatherData = null;
        let sunriseTime = new Date().setHours(6, 0, 0, 0); // Padrão
        let sunsetTime = new Date().setHours(18, 0, 0, 0); // Padrão
        let weatherCode = 0;

        // Gerar estrelas
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3 + 1}px`;
            star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.animationDuration = `${Math.random() * 4 + 2}s`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            starsContainer.appendChild(star);
        }

        // SVG do Sol
        const sunSVG = `
            <svg viewBox="0 0 100 100" width="160" height="160" class="celestial-svg">
                <defs>
                    <radialGradient id="sun-gradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFF7A1"/>
                        <stop offset="60%" stop-color="#FFD15C"/>
                        <stop offset="100%" stop-color="#FF9B00"/>
                    </radialGradient>
                    <filter id="sun-glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="35" fill="url(#sun-gradient)" filter="url(#sun-glow)"/>
                <g stroke="#FFD15C" stroke-width="4" stroke-linecap="round">
                    <line x1="50" y1="5" x2="50" y2="10" />
                    <line x1="50" y1="90" x2="50" y2="95" />
                    <line x1="5" y1="50" x2="10" y2="50" />
                    <line x1="90" y1="50" x2="95" y2="50" />
                    <line x1="18" y1="18" x2="22" y2="22" />
                    <line x1="78" y1="78" x2="82" y2="82" />
                    <line x1="18" y1="82" x2="22" y2="78" />
                    <line x1="78" y1="18" x2="82" y2="22" />
                </g>
            </svg>
        `;

        // Lua Real, Fase e Iluminação usando API/Imagem do lunopia.com
        const moonImageTemplate = () => {
            const cacheBuster = Math.floor(Date.now() / 3600000); 
            return `<img src="https://www.lunopia.com/pt/mod/moon.png?bg=transparent&fg=@ffffff&date=false&percent=true&phase=true&size=200&t=${cacheBuster}" width="180" height="auto" class="celestial-svg" alt="Lua">`;
        };

        const cloudSVG = `
            <svg viewBox="0 0 100 100" class="weather-icon">
                <path d="M30,65 A15,15 0 0,1 45,45 A20,20 0 0,1 80,55 A15,15 0 0,1 80,85 L30,85 A15,15 0 0,1 30,65 Z" fill="#ffffff" opacity="0.95"/>
            </svg>
        `;

        const rainSVG = `
            <svg viewBox="0 0 100 100" class="weather-icon">
                <path d="M30,55 A15,15 0 0,1 45,35 A20,20 0 0,1 80,45 A15,15 0 0,1 80,75 L30,75 A15,15 0 0,1 30,55 Z" fill="#b0c4de" opacity="0.95"/>
                <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8">
                    <line x1="40" y1="75" x2="35" y2="90" />
                    <line x1="55" y1="75" x2="50" y2="90" />
                    <line x1="70" y1="75" x2="65" y2="90" />
                </g>
            </svg>
        `;

        // Paletas de Fundo Dinâmicas
        const palettes = {
            night: ['#0f2027', '#203a43', '#2c5364'],
            sunrise: ['#ff7e5f', '#feb47b', '#86a8e7'],
            day: ['#2980b9', '#6dd5fa', '#91eae4'],
            sunset: ['#ff4e50', '#f9d423', '#2c3e50']
        };

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)] : null;
        }

        function interpolateColor(color1, color2, factor) {
            const rgb1 = hexToRgb(color1);
            const rgb2 = hexToRgb(color2);
            const result = rgb1.map((c, i) => Math.round(c + factor * (rgb2[i] - c)));
            return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
        }

        // Transição matemática do amanhecer/anoitecer
        function getBackgroundColors(nowTime, srTime, ssTime) {
            const HOUR = 60 * 60 * 1000;
            if (nowTime < srTime - HOUR) return palettes.night;
            if (nowTime >= srTime - HOUR && nowTime < srTime) {
                let factor = (nowTime - (srTime - HOUR)) / HOUR;
                return [
                    interpolateColor(palettes.night[0], palettes.sunrise[0], factor),
                    interpolateColor(palettes.night[1], palettes.sunrise[1], factor),
                    interpolateColor(palettes.night[2], palettes.sunrise[2], factor)
                ];
            }
            if (nowTime >= srTime && nowTime < srTime + 2 * HOUR) {
                let factor = (nowTime - srTime) / (2 * HOUR);
                return [
                    interpolateColor(palettes.sunrise[0], palettes.day[0], factor),
                    interpolateColor(palettes.sunrise[1], palettes.day[1], factor),
                    interpolateColor(palettes.sunrise[2], palettes.day[2], factor)
                ];
            }
            if (nowTime >= srTime + 2 * HOUR && nowTime < ssTime - 2 * HOUR) {
                return palettes.day;
            }
            if (nowTime >= ssTime - 2 * HOUR && nowTime < ssTime) {
                let factor = (nowTime - (ssTime - 2 * HOUR)) / (2 * HOUR);
                return [
                    interpolateColor(palettes.day[0], palettes.sunset[0], factor),
                    interpolateColor(palettes.day[1], palettes.sunset[1], factor),
                    interpolateColor(palettes.day[2], palettes.sunset[2], factor)
                ];
            }
            if (nowTime >= ssTime && nowTime < ssTime + HOUR) {
                let factor = (nowTime - ssTime) / HOUR;
                return [
                    interpolateColor(palettes.sunset[0], palettes.night[0], factor),
                    interpolateColor(palettes.sunset[1], palettes.night[1], factor),
                    interpolateColor(palettes.sunset[2], palettes.night[2], factor)
                ];
            }
            return palettes.night;
        }

        // Fetch do clima atual e horários do Sol em SP
        async function fetchWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&daily=sunrise,sunset&timezone=America%2FSao_Paulo`);
                weatherData = await res.json();
                
                if(weatherData && weatherData.daily) {
                    sunriseTime = new Date(weatherData.daily.sunrise[0]).getTime();
                    sunsetTime = new Date(weatherData.daily.sunset[0]).getTime();
                }
                if(weatherData && weatherData.current_weather) {
                    weatherCode = weatherData.current_weather.weathercode;
                }
                updateUI();
            } catch (e) {
                console.error("Erro ao buscar clima de SP", e);
                updateUI();
            }
        }

        function getWeatherDesc(code, isDay) {
            if (code === 0) return isDay ? 'Céu Limpo' : 'Noite Estrelada';
            if (code >= 1 && code <= 3) return 'Parcialmente Nublado';
            if (code >= 45 && code <= 48) return 'Neblina';
            if (code >= 51 && code <= 67) return 'Chuvoso';
            if (code >= 71 && code <= 77) return 'Neve (Incomum!)';
            if (code >= 80 && code <= 82) return 'Pancadas de Chuva';
            if (code >= 95) return 'Tempestade';
            return 'Clima Misto';
        }

        const getMoonPhaseText = (date) => {
            let year = date.getFullYear();
            let month = date.getMonth() + 1;
            let day = date.getDate();
            let c = 0, e = 0, jd = 0, b = 0;
            if (month < 3) { year--; month += 12; }
            ++month;
            c = 365.25 * year;
            e = 30.6 * month;
            jd = c + e + day - 694039.09;
            jd /= 29.5305882;
            b = parseInt(jd);
            jd -= b;
            b = Math.round(jd * 8);
            if (b >= 8) b = 0;

            const names = ['Nova', 'Crescente', 'Quarto Crescente', 'Crescente', 'Cheia', 'Minguante', 'Quarto Minguante', 'Minguante'];
            return `Lua ${names[b]}`;
        };

        const updateUI = () => {
            const now = new Date();
            const nowTime = now.getTime();
            
            // Relógio 12h AM/PM
            const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);
            
            // Data
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', dateOptions);
            
            // Fundo dinâmico (transição suave calculada matematicamente)
            const colors = getBackgroundColors(nowTime, sunriseTime, sunsetTime);
            document.documentElement.style.setProperty('--bg-color-1', colors[0]);
            document.documentElement.style.setProperty('--bg-color-2', colors[1]);
            document.documentElement.style.setProperty('--bg-color-3', colors[2]);

            // Estrelas somem de dia
            const isNight = nowTime < sunriseTime || nowTime > sunsetTime;
            document.getElementById('stars').style.opacity = isNight ? '1' : '0';

            // Saudação
            const hour = now.getHours();
            const greetingElement = document.getElementById('greeting');
            if (hour >= 5 && hour < 12) greetingElement.textContent = 'Bom dia!';
            else if (hour >= 12 && hour < 18) greetingElement.textContent = 'Boa tarde!';
            else greetingElement.textContent = 'Boa noite!';

            // Renderizar Sol ou Lua
            const isDay = nowTime >= sunriseTime && nowTime <= sunsetTime;
            let celestialHTML = '';
            let weatherText = getWeatherDesc(weatherCode, isDay);
            let celestialText = '';

            if (isDay) {
                celestialHTML = sunSVG;
                celestialText = 'Sol';
                document.getElementById('celestial-glow').style.background = 'radial-gradient(circle, rgba(255, 235, 100, 0.4) 0%, rgba(255,255,255,0) 70%)';
                document.getElementById('celestial-name').style.display = 'inline-block';
                document.getElementById('celestial-name').textContent = celestialText;
            } else {
                celestialHTML = moonImageTemplate();
                celestialText = ''; // A imagem do lunopia já possui as informações
                document.getElementById('celestial-glow').style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255,255,255,0) 70%)';
                document.getElementById('celestial-name').style.display = 'none'; // Esconde a tag, pois a info está na imagem
            }

            const celestialBody = document.getElementById('celestial-body');
            if(celestialBody.innerHTML !== celestialHTML) {
                celestialBody.innerHTML = celestialHTML;
            }

            // Renderizar Ícones de Clima (Nuvem, Chuva) em frame separado
            let weatherHTML = '';
            if (weatherCode >= 1 && weatherCode <= 48) {
                weatherHTML = cloudSVG;
            } else if (weatherCode >= 51) {
                weatherHTML = rainSVG;
            }

            const weatherBody = document.getElementById('weather-body');
            const weatherColumn = document.getElementById('weather-column');
            const weatherContainer = document.getElementById('weather-container');
            
            if(weatherBody.innerHTML !== weatherHTML) {
                weatherBody.innerHTML = weatherHTML;
            }

            // Mostra ou esconde a coluna inteira do clima se houver ícone para mostrar
            if (weatherHTML === '') {
                weatherColumn.style.display = 'none';
            } else {
                weatherColumn.style.display = 'flex';
                weatherContainer.style.display = 'flex';
                document.getElementById('weather-name').textContent = weatherText;
            }
        };

        // Loop principal
        updateUI(); 
        fetchWeather(); // Busca o clima de SP
        setInterval(updateUI, 1000); 
    </script>
</body>
</html>
